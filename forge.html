<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge des Épreuves — Sombre Éclair</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#49206c,#08050e 55%);color:#f4eaff;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:32px 18px 70px}a{color:#e2b8ff}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:38px}header strong{font-size:1.1rem;letter-spacing:.1em}h1{font-size:clamp(2rem,6vw,3.6rem);font-family:Georgia,serif;margin:10px 0 16px}p{line-height:1.6;color:#d3c2e0}.card{border:1px solid #8e57c8;background:#130c20d9;padding:clamp(20px,4vw,35px);border-radius:22px;box-shadow:0 20px 70px #0008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:25px 0}label{display:block;margin-bottom:9px;font-weight:700;color:#e1c3ff}select,textarea{display:block;width:100%;background:#090611;color:#f4eaff;border:1px solid #9566c7;border-radius:10px;padding:13px;font:inherit}textarea{min-height:180px;resize:vertical;line-height:1.6}h2{font-size:1.4rem;color:#ebd4ff}ol{line-height:1.8;padding-left:25px}li{margin:8px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #bd87ef;background:#7840b7;color:white;padding:14px 20px;border-radius:12px;font:inherit;font-weight:bold;cursor:pointer}button:hover{background:#9959d9}button.secondary{background:#251634}#status{min-height:1.5em;color:#d7b6ff}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions button{width:100%}}@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap');body{font-family:Outfit,Arial,sans-serif;background:radial-gradient(ellipse 75% 40% at 50% -5%,#58238a,transparent 75%),radial-gradient(ellipse 45% 40% at 100% 80%,#28103c,transparent 85%),#050309}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#cba2ff28 .7px,transparent .7px);background-size:27px 27px;z-index:-1}h1,h2{font-family:Cinzel,Georgia,serif}h1{background:linear-gradient(100deg,#fff,#d1a1ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 12px 50px #aa5fff35}.card{background:linear-gradient(145deg,#1d102f,#0a0711 85%);border-color:#b57de7;box-shadow:0 20px 80px #000a,0 0 65px #6d2aaf20;position:relative;overflow:hidden}.card:before{content:"";position:absolute;top:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,#e2b6ff,transparent)}button{transition:transform .2s,filter .2s,box-shadow .2s}button:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 12px 30px #9a48e347}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #d9adff;outline-offset:3px}select,textarea{border-color:#9d69ce;background:#0c0717}header strong{color:#e4c0ff;text-shadow:0 0 22px #a46aff60}@media(prefers-reduced-motion:reduce){button{transition:none}}body{background:#030207!important;position:relative}body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 65% 65% at 10% 15%,#421466aa,transparent 75%),radial-gradient(ellipse 50% 50% at 90% 85%,#4a176e99,transparent 80%),linear-gradient(145deg,#030207,#0b0615 55%,#030207);animation:forge-storm 14s ease-in-out infinite alternate}body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(#d3a2ff55 .8px,transparent 1px),linear-gradient(125deg,transparent 49.7%,#c68aff22 50%,transparent 50.3%);background-size:33px 33px,1000px 1000px;animation:forge-stars 35s linear infinite}@keyframes forge-storm{to{filter:brightness(1.3);transform:scale(1.05)}}@keyframes forge-stars{to{background-position:100px 170px,0 0}}@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}}</style></head><body><main><header><strong>ϟ SOMBRE ÉCLAIR</strong><a href="./index.html#sommaire">← Retour au site</a></header><div class="card"><p>ϟ ORGANISATION DÉMONIAQUE</p><h1>La Forge des Épreuves</h1><p>Invente des entraînements RP pour 1 à 15 démons. Sélectionne Griffe, Oratoire ou les deux, puis génère un programme et une annonce à copier.</p><div class="grid"><div><label for="discipline">Discipline</label><select id="discipline"><option value="griffe">Griffe</option><option value="oratoire">Oratoire</option><option value="both">Griffe + Oratoire</option></select></div><div><label for="number">Nombre de démons</label><select id="number"><option value="1">1 démon</option><option value="2">2 démons</option><option value="3">3 démons</option><option value="4">4 démons</option><option value="5">5 démons</option><option value="6">6 démons</option><option value="7">7 démons</option><option value="8">8 démons</option><option value="9">9 démons</option><option value="10">10 démons</option><option value="11">11 démons</option><option value="12">12 démons</option><option value="13">13 démons</option><option value="14">14 démons</option><option value="15">15 démons</option></select></div></div><h2 id="heading">Épreuves proposées</h2><ol id="steps"></ol><label for="announcement">Annonce prête à copier</label><textarea id="announcement"></textarea><div class="actions"><button type="button" id="generate">ϟ Inventer un entraînement</button><button type="button" class="secondary" id="copy">Copier l'annonce</button></div><p id="status" role="status"></p></div></main><script>
(function(){
var discipline=document.getElementById('discipline'),number=document.getElementById('number'),heading=document.getElementById('heading'),steps=document.getElementById('steps'),announcement=document.getElementById('announcement'),status=document.getElementById('status');
var g=['Duel de griffes : alternance attaque et défense.','Défi de précision : présenter trois gestes RP maîtrisés.','Combat à contrainte : une manche sans esquive.','Enchaînement de griffes en trois mouvements.','Épreuve de coordination en équipe.','Démonstration technique devant le formateur.'];
var o=['Duel oratoire : défendre deux idées opposées.','Débat sur les préceptes de l’Ordre démoniaque.','Improvisation : expliquer une mission fictive.','Discours d’une minute devant les participants.','Argumentation : convaincre le groupe de choisir une stratégie.','Questions du formateur et réponses rapides.'];
var turn=0;
function generate(){
var n=Number(number.value),d=discipline.value,arr=[],name=d==='both'?'Griffe + Oratoire':d==='griffe'?'Griffe':'Oratoire';
if(d==='griffe'||d==='both'){arr.push(g[turn%g.length]);arr.push(g[(turn+2)%g.length]);}
if(d==='oratoire'||d==='both'){arr.push(o[(turn+1)%o.length]);arr.push(o[(turn+3)%o.length]);}
var org=n===1?'individuel':n===2?'en binôme':n<=6?'en petits groupes':'en équipes';
heading.textContent='Programme n°'+(turn+1)+' — '+name+' — '+n+' démon'+(n>1?'s':'');
steps.textContent='';arr.forEach(function(t){var li=document.createElement('li');li.textContent=t;steps.appendChild(li);});
var lines=['ϟ ENTRAÎNEMENT DU SOMBRE ÉCLAIR ϟ','Discipline : '+name,'Participants : '+n,'Organisation : '+org,'Épreuves :'].concat(arr.map(function(x,i){return (i+1)+'. '+x;}),['Bilan du formateur.','Lieu et horaire : à préciser.']);
announcement.value=lines.join(String.fromCharCode(10));
status.textContent='Programme n°'+(turn+1)+' généré.';turn++;
}
document.getElementById('generate').addEventListener('click',generate);
document.getElementById('copy').addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(announcement.value).then(function(){status.textContent='Annonce copiée !';},function(){announcement.focus();announcement.select();status.textContent='Texte sélectionné : Ctrl+C.';});}else{announcement.focus();announcement.select();status.textContent='Texte sélectionné : Ctrl+C.';}});
discipline.addEventListener('change',generate);number.addEventListener('change',generate);generate();
})();
</script></body></html>
